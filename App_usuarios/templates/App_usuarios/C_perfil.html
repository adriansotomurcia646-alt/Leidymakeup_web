{% extends 'App_usuarios/C_base.html' %}

{% block title %}Mi Perfil - Leidy Make Up{% endblock %}

{% block content %}
<div>
      <h2 class="text-2xl font-bold text-gray-900">Mi perfil</h2>
      <p class="text-xs text-gray-500">Actualiza tu información de contacto.</p>
    </div>

    <div class="bg-white border border-rose-100 rounded-2xl p-6 shadow-sm space-y-4">
      <div class="flex items-center gap-4 border-b border-gray-100 pb-4">
        <div class="w-12 h-12 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center text-lg">A</div>
        <div>
          <h4 class="font-bold text-gray-900 text-sm">{{ request.user.get_full_name|default:request.user.username }}</h4>
          <p class="text-xs text-gray-400">Cuenta de cliente</p>
        </div>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre</label>
            <input type="text" name="first_name" value="{{ request.user.first_name }}" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Apellido</label>
            <input type="text" name="last_name" value="{{ request.user.last_name }}" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Teléfono</label>
          <div class="relative">
            <i data-lucide="phone" class="w-3.5 h-3.5 absolute left-3 top-3 text-gray-400"></i>
            <input type="text" name="telefono" value="{{ cliente.telefono|default:'' }}" class="w-full pl-8 pr-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" name="email" value="{{ request.user.email }}" required class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
        </div>

        <button type="submit" class="px-4 py-2.5 bg-rose-600 text-white rounded-xl text-xs font-semibold hover:bg-rose-700 transition-all shadow-sm">
          Guardar cambios
        </button>
      </form>
    </div>
{% endblock %}
