<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - Leidy Make Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fdf8f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-3xl border border-rose-100 bg-white p-8 shadow-sm">
    <div class="mb-5 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-rose-600 text-white">
        <i data-lucide="sparkles" class="h-6 w-6"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Crear cuenta de cliente</h1>
      <p class="mt-1 text-xs text-gray-500">Regístrate para reservar tus citas.</p>
    </div>

    {% for message in messages %}
      <p class="mb-3 rounded-lg bg-rose-50 p-3 text-sm text-rose-700">{{ message }}</p>
    {% endfor %}

    <form method="post" action="{% url 'App_usuarios:registro' %}" class="space-y-3">
      {% csrf_token %}
      <label class="block text-xs font-semibold text-gray-700">
        Nombre
        <input type="text" name="nombre" autocomplete="given-name" required class="mt-1 w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm">
      </label>
      <label class="block text-xs font-semibold text-gray-700">
        Apellido
        <input type="text" name="apellido" autocomplete="family-name" class="mt-1 w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm">
      </label>
      <label class="block text-xs font-semibold text-gray-700">
        Correo electrónico
        <input type="email" name="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm">
      </label>
      <label class="block text-xs font-semibold text-gray-700">
        Teléfono
        <input type="tel" name="telefono" autocomplete="tel" class="mt-1 w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm">
      </label>
      <label class="block text-xs font-semibold text-gray-700">
        Contraseña
        <input type="password" name="password" autocomplete="new-password" required class="mt-1 w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm">
      </label>
      <button type="submit" class="w-full rounded-xl bg-rose-600 py-3 text-sm font-semibold text-white hover:bg-rose-700">
        Crear cuenta
      </button>
    </form>
    <p class="mt-5 text-center text-xs text-gray-500">
      ¿Ya tienes una cuenta?
      <a href="{% url 'App_usuarios:login' %}" class="font-bold text-rose-600 hover:underline">Inicia sesión</a>
    </p>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
