<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Leidy Make Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fdf8f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <!-- Contenedor principal que centra la tarjeta y se adapta a toda la pantalla -->
<!-- Contenedor general centrado -->
<div class="min-h-screen w-full bg-gray-50 flex items-center justify-center p-4 sm:p-8">

  <!-- Tarjeta ampliada: pasa de max-w-md a max-w-xl / max-w-2xl -->
  <div class="w-full max-w-xl md:max-w-2xl bg-white rounded-3xl p-8 sm:p-12 border border-rose-100 shadow-lg text-center">
    
    <!-- LOGO Y TÍTULO -->
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-white mx-auto mb-4 shadow-md shadow-rose-200">
      <i data-lucide="sparkles" class="w-8 h-8"></i>
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Leidy Make Up</h1>
    <p class="text-sm text-gray-400 mt-1 mb-8">Gestión de citas para tu salón de belleza</p>

    <!-- SELECTOR DE ROL -->
    <div class="bg-gray-50 p-1.5 rounded-2xl flex gap-2 mb-8 border border-gray-100">
      <button type="button" id="btn-cliente" onclick="setRole('cliente')" class="flex-1 py-3 rounded-xl text-sm font-semibold text-gray-600 transition-all flex items-center justify-center gap-2">
        <i data-lucide="user" class="w-4 h-4"></i> Cliente
      </button>
      <button type="button" id="btn-estilista" onclick="setRole('estilista')" class="flex-1 py-3 rounded-xl text-sm font-semibold bg-white text-gray-800 shadow-sm transition-all flex items-center justify-center gap-2">
        <i data-lucide="scissors" class="w-4 h-4"></i> Estilista
      </button>
    </div>

    <!-- FORMULARIO LOGIN -->
    <form method="post" action="{% url 'App_usuarios:login' %}" class="space-y-6 text-left">
      {% csrf_token %}
      <input type="hidden" id="rol" name="rol" value="{{ rol_seleccionado }}">
      {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
      
      <div>
        <label id="lbl-user" class="block text-sm font-semibold text-gray-700 mb-2">Correo electrónico o Teléfono</label>
        <div class="relative">
          <i data-lucide="user" class="w-5 h-5 absolute left-3.5 top-3.5 text-gray-400"></i>
          <input type="text" name="username" autocomplete="username" required placeholder="Ingresa tu correo o teléfono" class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 bg-gray-50/50">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
        <div class="relative">
          <i data-lucide="lock" class="w-5 h-5 absolute left-3.5 top-3.5 text-gray-400"></i>
          <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 bg-gray-50/50">
        </div>
      </div>

      <button type="submit" class="w-full py-4 bg-rose-600 text-white rounded-xl text-sm font-bold hover:bg-rose-700 transition-all shadow-md shadow-rose-200 mt-2">Iniciar sesión</button>
    </form>

    {% for message in messages %}
      <p class="text-sm font-medium text-rose-600 mt-4 bg-rose-50 py-2.5 px-4 rounded-xl border border-rose-100">{{ message }}</p>
    {% endfor %}
    
    <p class="text-sm text-gray-500 mt-8">
      ¿Aún no tienes cuenta?
      <a href="{% url 'App_usuarios:registro' %}" class="font-bold text-rose-600 hover:underline">Regístrate</a>
    </p>
  </div>

</div>

  <script>
    function setRole(role) {
      document.getElementById('rol').value = role;
      const cliente = document.getElementById('btn-cliente');
      const estilista = document.getElementById('btn-estilista');
      cliente.classList.toggle('bg-white', role === 'cliente');
      cliente.classList.toggle('text-gray-800', role === 'cliente');
      cliente.classList.toggle('shadow-sm', role === 'cliente');
      estilista.classList.toggle('bg-white', role === 'estilista');
      estilista.classList.toggle('text-gray-800', role === 'estilista');
      estilista.classList.toggle('shadow-sm', role === 'estilista');
    }
    setRole(document.getElementById('rol').value);
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
