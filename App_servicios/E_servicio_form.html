{% extends 'App_usuarios/E_base.html' %}

{% block title %}{{ accion }} Servicio - Leidy Make Up{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-rose-100/70 shadow-sm space-y-6">

  <div>
    <h2 class="text-xl font-bold text-[#800020]">{{ accion }} servicio</h2>
    <p class="text-xs text-rose-400 mt-0.5">Ingresa los detalles del servicio para actualizar el catálogo.</p>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    
    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Nombre del servicio</label>
      <input type="text" name="nombre" value="{{ servicio.nombre|default:'' }}" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-rose-400">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Categoría</label>
      <input type="text" name="categoria" value="{{ servicio.categoria|default:'' }}" placeholder="ej: Keratina, Maquillaje, Peinado" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-rose-400">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-700 mb-1">Descripción</label>
      <textarea name="descripcion" rows="3" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-rose-400">{{ servicio.descripcion|default:'' }}</textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Precio ($)</label>
        <input type="number" name="precio" value="{{ servicio.precio|default:'' }}" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-rose-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Duración (minutos)</label>
        <input type="number" name="duracion" value="{{ servicio.duracion|default:'' }}" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-rose-400">
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
      <a href="{% url 'App_servicios:lista' %}" class="px-4 py-2 text-xs font-semibold text-gray-500 hover:text-gray-800">Cancelar</a>
      <button type="submit" class="px-5 py-2.5 bg-[#d6336c] hover:bg-[#b02555] text-white rounded-xl text-xs font-bold transition-all shadow-sm">
        Guardar servicio
      </button>
    </div>
  </form>

</div>
{% endblock %}
